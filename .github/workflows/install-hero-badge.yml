name: Install hero badge

on:
  push:
    paths:
      - ".asset-staging/hero-badge-*"
      - ".asset-staging/HERO_BADGE_READY"

permissions:
  contents: write

jobs:
  install-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode badge
        run: |
          mkdir -p public/brand
          cat .asset-staging/hero-badge-b64-* | base64 -d > public/brand/twoball-badge.webp
      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/twoball-badge.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add full TwoBall hero badge"
          git push
