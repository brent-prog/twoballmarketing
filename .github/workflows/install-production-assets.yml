name: Install production assets

on:
  push:
    paths:
      - ".asset-source/**"

permissions:
  contents: write

jobs:
  install-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode production assets
        run: |
          mkdir -p public/brand public/images
          base64 -d .asset-source/twoball-logo.webp.b64 > public/brand/twoball-logo.webp
          base64 -d .asset-source/twoball-board.webp.b64 > public/images/twoball-board.webp

      - name: Commit production assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/twoball-logo.webp public/images/twoball-board.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add production TwoBall visual assets"
          git push
